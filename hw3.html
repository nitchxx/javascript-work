<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let userProfile = {
        username: " CoolUser99 ",
        bio: " I LOVE coding! JavaScript is Great!!! "
    };

    function cleanUserBio(profile) {
        let cleanUsername = profile.username
            .trim()
            .toLowerCase();

        let cleanBio = profile.bio
            .trim()
            .toLowerCase()
            .replace(/javascript/g, "JS");

        let bioLength = cleanBio.length;

        return {
            username: cleanUsername,
            bio: cleanBio,
            bioLength: bioLength
        };
    }

    let finalResult = cleanUserBio(userProfile);

    console.log(finalResult);
    </script>
</body>
</html>
