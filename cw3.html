<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h2>Feedback form</h2>
    <form action="#">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter Your name">
        <label for="pass">Password:</label>
        <input type="password" id="pass" placeholder="Enter your password">
    </form><br>
    <button type="submit" onclick="stringfunction()">Submit</button>
    <p id="string"></p>
    <script>
        function stringfunction(){
            var feedback = "   I loved the FOOD and the service!   ";
            var space = feedback.trim();
            var tran = space.toLowerCase();
            var rep = tran.replace(/food/i,"ambience");
            var pos =rep.indexOf("service");
            var arr =rep.split(" ");
            document.getElementById("string").innerHTML = rep;
            console.log(space);
            console.log(tran);
            console.log(rep);
            console.log(arr);
            console.log("Service Postition ="+" "+pos);  
        }
        console.log("   I loved the FOOD and the service!   ");
    </script>
